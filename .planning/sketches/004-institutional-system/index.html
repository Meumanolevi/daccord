<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>D’Accord · Sketch 004 · Sistema institucional</title>
  <link id="theme-link" rel="stylesheet" href="../themes/default.css">
  <style>
    * { box-sizing:border-box; }
    html { background:#ece8ea; color:var(--color-text); font-family:var(--font-sans); }
    body { min-width:320px; margin:0; padding-top:58px; }
    button,input,select { font:inherit; }
    button,a,summary { transition:all .15s ease; }
    button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible { outline:2px solid var(--color-focus); outline-offset:3px; }
    button { color:inherit; cursor:pointer; }
    [hidden] { display:none !important; }
    .variant-nav { position:fixed; z-index:9998; inset:0 0 auto; display:flex; min-height:58px; align-items:center; gap:8px; padding:9px 16px; overflow-x:auto; border-bottom:1px solid #cbc3c7; background:rgba(255,255,255,.98); box-shadow:0 6px 20px rgba(43,25,36,.08); font-family:system-ui,sans-serif; }
    .variant-nav__label { margin-right:8px; color:#6b6267; font-size:11px; font-weight:800; letter-spacing:.09em; white-space:nowrap; }
    .variant-tab { min-height:36px; padding:7px 12px; border:1px solid #d2c9cd; background:white; white-space:nowrap; }
    .variant-tab:hover { border-color:var(--color-primary); color:var(--color-primary); }
    .variant-tab.active { border-color:var(--color-text); background:var(--color-text); color:white; }
    .sketch-stage { min-height:calc(100vh - 58px); padding:24px; }
    .viewport-shell { width:100%; margin:0 auto; transition:width .25s ease; }
    #sketch-viewport { width:100%; min-height:900px; overflow:hidden; border:1px solid #bbb1b6; background:var(--color-surface); box-shadow:var(--shadow-lg); container-type:inline-size; }
    #sketch-viewport.large-text { font-size:112.5%; }
    #sketch-viewport.reading-mode .article-copy,#sketch-viewport.reading-mode .section-body { max-width:68ch; font-family:Georgia,serif; font-size:1rem; line-height:1.85; }
    #sketch-viewport.high-contrast { --color-text:#14000c; --color-text-muted:#3f2434; --color-primary:#720043; --color-primary-hover:#52002f; --color-border-soft:rgba(20,0,12,.4); }
    .variant { display:none; min-height:900px; background:var(--color-bg); }
    .variant.active { display:block; }

    .shell-header { position:relative; z-index:20; border-bottom:3px solid var(--color-primary); background:white; }
    .login-notice { display:grid; min-height:31px; place-items:center; padding:6px 16px; background:var(--color-surface-soft); font-size:11px; text-align:center; }
    .login-notice strong { text-decoration:underline; text-underline-offset:2px; }
    .main-row { display:grid; min-height:80px; grid-template-columns:1fr auto 1fr; align-items:center; gap:20px; padding:10px 38px; }
    .utility,.actions { display:flex; align-items:center; gap:15px; }
    .utility button,.actions button { min-height:36px; border:0; background:transparent; font-size:11px; }
    .utility button:hover,.actions button:hover { color:var(--color-primary); }
    .actions { justify-self:end; }
    .brand-home { grid-column:2; justify-self:center; }
    .brand-logo { display:block; width:188px; height:auto; }
    .outlined { padding:8px 12px !important; border:1px solid var(--color-text) !important; }
    .guided-rail { display:grid; grid-template-columns:minmax(260px,.72fr) minmax(0,1.28fr); border-top:1px solid var(--color-border-soft); }
    .analysis-entry { display:flex; min-height:54px; align-items:center; justify-content:space-between; gap:14px; padding:8px 18px 8px 38px; background:var(--color-primary); color:white; }
    .analysis-entry p { margin:0; font-size:11px; }
    .analysis-entry strong { display:block; font-size:13px; }
    .analysis-entry button { min-height:35px; padding:7px 11px; border:1px solid white; background:transparent; color:white; font-size:10px; font-weight:800; }
    .analysis-entry button:hover { background:white; color:var(--color-primary); }
    .search-form { display:flex; min-width:0; height:54px; border-left:1px solid var(--color-border-soft); background:white; }
    .search-form input { min-width:0; flex:1; padding:0 16px; border:0; outline:0; background:transparent; color:var(--color-text); }
    .search-form button { width:54px; border:0; background:transparent; font-size:18px; }
    .search-form button:hover { background:var(--color-surface-soft); color:var(--color-primary); }
    .mobile-search,.mobile-menu { display:none; width:42px; height:42px; place-items:center; border:0; background:transparent; font-size:20px; }
    .mobile-panel { display:none; padding:14px; border-top:1px solid var(--color-border-soft); background:white; }
    .mobile-panel.open { display:grid; gap:10px; }
    .mobile-panel .search-form { height:44px; border:1px solid var(--color-border-soft); }
    .mobile-panel button { min-height:42px; border:0; border-bottom:1px solid var(--color-border-soft); background:transparent; text-align:left; }

    .document-switcher { display:flex; min-height:54px; align-items:center; justify-content:space-between; gap:20px; padding:9px 38px; border-bottom:1px solid var(--color-border-soft); background:#faf8f9; }
    .document-switcher__pages,.document-tools { display:flex; align-items:center; gap:7px; }
    .document-switcher button { min-height:34px; padding:7px 10px; border:0; background:transparent; font-size:10px; font-weight:800; }
    .document-switcher__pages button:hover,.document-switcher__pages button[aria-pressed="true"] { background:var(--color-text); color:white; }
    .document-tools button { border:1px solid var(--color-border-soft); background:white; }
    .document-tools button:hover,.document-tools button[aria-pressed="true"] { border-color:var(--color-primary); color:var(--color-primary); }
    .mobile-page-select { display:none; width:100%; min-height:42px; padding:8px 10px; border:1px solid var(--color-border-soft); background:white; }

    .institutional-page { position:relative; min-height:650px; }
    .document-status { color:var(--color-text-muted); font-size:9px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
    .document-status strong { color:var(--color-primary); }
    .update-callout { margin:0; padding:12px 38px; border-bottom:1px solid #d7b06c; background:#fff7e8; color:#6a4510; font-size:10px; font-weight:700; }
    .eyebrow { margin:0 0 8px; color:var(--color-primary); font-size:10px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
    .page-title { margin:0; font-family:var(--font-display); font-size:clamp(48px,6.5vw,88px); line-height:.87; text-transform:uppercase; }
    .page-intro { max-width:760px; margin:18px 0 0; color:var(--color-text-muted); font-size:15px; line-height:1.55; }
    .section-title { margin:0; font-family:var(--font-display); font-size:31px; line-height:1; text-transform:uppercase; }
    .section-body,.article-copy { color:var(--color-text-muted); font-size:13px; line-height:1.72; }
    .section-body p:first-child { margin-top:0; }
    .section-body ul { padding-left:20px; }
    .section-number { color:var(--color-primary); font-size:10px; font-weight:800; letter-spacing:.1em; }
    .contact-block { display:grid; grid-template-columns:1fr auto; align-items:center; gap:20px; margin-top:28px; padding:20px; border-left:4px solid var(--color-primary); background:var(--color-surface-soft); }
    .contact-block strong { display:block; margin-bottom:5px; font-size:13px; }
    .contact-block p { margin:0; color:var(--color-text-muted); font-size:11px; }
    .primary,.secondary { min-height:40px; padding:8px 13px; font-size:10px; font-weight:800; }
    .primary { border:1px solid var(--color-primary); background:var(--color-primary); color:white; }
    .primary:hover { border-color:var(--color-primary-hover); background:var(--color-primary-hover); }
    .secondary { border:1px solid var(--color-text); background:white; }
    .secondary:hover { border-color:var(--color-primary); color:var(--color-primary); }

    /* Variant A */
    .editorial-hero { display:grid; min-height:390px; grid-template-columns:minmax(0,1.15fr) minmax(280px,.85fr); background:var(--color-primary); color:white; }
    .editorial-hero__copy { display:flex; flex-direction:column; justify-content:center; padding:48px 38px; }
    .editorial-hero .eyebrow { color:#f0dce6; }
    .editorial-hero .page-intro { color:rgba(255,255,255,.78); }
    .editorial-hero .document-status { color:rgba(255,255,255,.7); }
    .editorial-hero .document-status strong { color:white; }
    .editorial-hero__mark { display:grid; place-items:center; overflow:hidden; border-left:1px solid rgba(255,255,255,.22); background:linear-gradient(135deg,#b4568c,#7c1b57); }
    .editorial-hero__mark span { font-family:var(--font-elegant); font-size:clamp(120px,18vw,260px); opacity:.3; }
    .chapter-strip { position:sticky; z-index:9; top:58px; display:flex; min-height:52px; align-items:center; gap:2px; overflow-x:auto; padding:0 38px; border-bottom:1px solid var(--color-border-soft); background:rgba(255,255,255,.97); scrollbar-width:none; }
    .chapter-strip button { min-height:51px; padding:8px 13px; border:0; border-bottom:3px solid transparent; background:transparent; font-size:10px; font-weight:800; white-space:nowrap; }
    .chapter-strip button:hover,.chapter-strip button.active { border-bottom-color:var(--color-primary); color:var(--color-primary); }
    .editorial-content { padding:12px 38px 70px; background:white; }
    .editorial-section { display:grid; grid-template-columns:90px minmax(0,.85fr) minmax(0,1.15fr); gap:26px; padding:42px 0; border-bottom:1px solid var(--color-border-soft); }

    /* Variant B */
    .dossier-head { padding:42px 38px 34px; border-bottom:1px solid var(--color-border-soft); background:white; }
    .dossier-head__meta { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-top:24px; }
    .dossier-grid { display:grid; grid-template-columns:270px minmax(0,1fr); min-height:580px; }
    .dossier-nav { align-self:start; padding:26px 22px 40px 38px; border-right:1px solid var(--color-border-soft); background:#faf7f8; }
    .dossier-nav strong { display:block; margin-bottom:12px; color:var(--color-primary); font-size:9px; letter-spacing:.1em; text-transform:uppercase; }
    .dossier-nav button { display:flex; width:100%; min-height:42px; align-items:center; justify-content:space-between; gap:12px; padding:9px 8px; border:0; border-bottom:1px solid var(--color-border-soft); background:transparent; font-size:10px; font-weight:700; text-align:left; }
    .dossier-nav button:hover,.dossier-nav button[aria-pressed="true"] { padding-left:13px; background:white; color:var(--color-primary); }
    .dossier-article { padding:38px 42px 68px; background:white; }
    .dossier-article__chapter { max-width:780px; }
    .dossier-article__chapter .section-title { font-size:38px; }
    .chapter-meta { display:flex; flex-wrap:wrap; gap:8px; margin:16px 0 22px; }
    .chapter-meta span { padding:5px 7px; background:var(--color-surface-soft); color:var(--color-text-muted); font-size:9px; font-weight:700; }
    .chapter-actions { display:flex; gap:7px; margin-top:28px; }

    /* Variant C */
    .hub-head { display:grid; grid-template-columns:minmax(0,1.3fr) minmax(250px,.7fr); gap:30px; padding:46px 38px 36px; border-bottom:1px solid var(--color-border-soft); background:white; }
    .hub-meta { align-self:end; padding:20px; border-top:4px solid var(--color-primary); background:var(--color-surface-soft); }
    .hub-meta strong { display:block; margin-bottom:6px; font-size:12px; }
    .hub-meta p { margin:0; color:var(--color-text-muted); font-size:10px; line-height:1.45; }
    .hub-content { display:grid; grid-template-columns:minmax(0,1fr) 280px; gap:26px; padding:30px 38px 70px; }
    .topic-list { border-top:1px solid var(--color-text); }
    .topic { border-bottom:1px solid var(--color-border-soft); background:white; }
    .topic summary { display:grid; min-height:72px; grid-template-columns:58px minmax(0,1fr) auto; align-items:center; gap:14px; padding:12px 10px; cursor:pointer; list-style:none; }
    .topic summary::after { font-size:22px; content:'+'; }
    .topic[open] summary::after { content:'−'; }
    .topic summary strong { font-family:var(--font-display); font-size:25px; text-transform:uppercase; }
    .topic-body { max-width:760px; padding:0 52px 24px 82px; color:var(--color-text-muted); font-size:12px; line-height:1.7; }
    .hub-aside { align-self:start; padding:20px; border:1px solid var(--color-text); background:white; }
    .hub-aside h2 { margin:0; font-family:var(--font-display); font-size:27px; text-transform:uppercase; }
    .hub-aside p { color:var(--color-text-muted); font-size:11px; line-height:1.5; }
    .hub-aside button { width:100%; margin-top:7px; }

    /* Synthesis D: modular hub with the lighter product visual language */
    .variant-d .document-switcher { border-bottom:0; background:white; box-shadow:0 6px 20px rgba(43,25,36,.05); }
    .variant-d .document-switcher__pages button,.variant-d .document-tools button { border:0; border-radius:4px; background:#f7f1f4; }
    .variant-d .document-switcher__pages button:hover,.variant-d .document-switcher__pages button[aria-pressed="true"] { background:var(--color-text); color:white; }
    .variant-d .document-tools button:hover,.variant-d .document-tools button[aria-pressed="true"] { border:0; background:#eee2e8; color:var(--color-primary); }
    .variant-d .mobile-page-select { border:0; border-radius:4px; background:#f7f1f4; box-shadow:0 1px 0 rgba(43,25,36,.12); }
    .variant-d .hub-head { border-bottom:0; background:#fffafb; }
    .variant-d .hub-head--visual { align-items:center; grid-template-columns:minmax(0,1.08fr) minmax(310px,.92fr); }
    .variant-d .hub-visual-column { display:grid; align-self:stretch; grid-template-rows:minmax(210px,1fr) auto; gap:12px; }
    .variant-d .hub-visual { position:relative; min-height:240px; margin:0; overflow:hidden; border-radius:10px; background:#eadde3; box-shadow:0 12px 34px rgba(43,25,36,.09); }
    .variant-d .hub-visual img { width:100%; height:100%; min-height:240px; object-fit:cover; filter:saturate(.82) contrast(.94); }
    .variant-d .hub-visual::after { position:absolute; inset:0; background:linear-gradient(180deg,transparent 45%,rgba(43,25,36,.72)); content:''; pointer-events:none; }
    .variant-d .hub-visual figcaption { position:absolute; z-index:1; right:18px; bottom:16px; left:18px; display:grid; gap:3px; color:white; }
    .variant-d .hub-visual figcaption span { font-size:8px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
    .variant-d .hub-visual figcaption strong { font-family:var(--font-display); font-size:21px; line-height:1; text-transform:uppercase; }
    .variant-d .hub-meta { position:relative; z-index:2; margin:0; border-top:0; border-left:3px solid var(--color-primary); border-radius:8px; background:#f8f1f4; box-shadow:0 8px 24px rgba(43,25,36,.09); }
    .variant-d .hub-content { background:#fff8fa; }
    .variant-d .topic-list { border-top:0; }
    .variant-d .topic { margin-bottom:9px; overflow:hidden; border-bottom:0; border-radius:8px; background:white; box-shadow:0 7px 22px rgba(43,25,36,.055); }
    .variant-d .topic summary { padding-inline:16px; }
    .variant-d .topic[open] { box-shadow:0 10px 28px rgba(43,25,36,.08); }
    .variant-d .topic[open] summary { background:#fcf7f9; }
    .variant-d .topic-body { padding-right:18px; }
    .variant-d .topic-body .secondary { border:0; border-radius:4px; box-shadow:0 1px 0 rgba(43,25,36,.14); }
    .variant-d .hub-aside { border:0; border-radius:10px; background:white; box-shadow:0 10px 30px rgba(43,25,36,.08); }
    .variant-d .hub-aside input { border:0 !important; border-radius:4px; background:#f7f1f4; box-shadow:0 1px 0 rgba(43,25,36,.12); }
    .variant-d .hub-aside .primary { border:0; border-radius:4px; }
    .variant-d .hub-aside .secondary { border:0; border-radius:4px; box-shadow:0 1px 0 rgba(43,25,36,.14); }

    .empty-document { display:grid; min-height:520px; place-items:center; padding:30px; text-align:center; }
    .empty-document h1 { margin:0; font-family:var(--font-display); font-size:52px; text-transform:uppercase; }
    .empty-document p { max-width:520px; color:var(--color-text-muted); }
    .loading-cover { position:absolute; z-index:15; inset:0; display:grid; place-items:center; background:rgba(255,248,250,.96); }
    .loading-cover span { width:54px; height:54px; border:4px solid #eadde3; border-top-color:var(--color-primary); border-radius:50%; animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }

    #toast { position:fixed; z-index:10003; right:22px; bottom:22px; max-width:340px; padding:13px 16px; border-left:4px solid var(--color-accent); background:var(--color-text); color:white; box-shadow:var(--shadow-lg); font:13px system-ui,sans-serif; opacity:0; pointer-events:none; transform:translateY(12px); }
    #toast.visible { opacity:1; transform:translateY(0); }
    #sketch-tools { position:fixed; z-index:10002; right:12px; bottom:12px; display:grid; gap:7px; min-width:210px; padding:9px 11px; border-radius:8px; background:rgba(0,0,0,.8); color:white; font:12px system-ui,sans-serif; opacity:.48; transition:opacity .2s ease; }
    #sketch-tools:hover,#sketch-tools:focus-within { opacity:1; }
    .tool-row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .tool-row button,.tool-row select { min-height:27px; padding:4px 7px; border:1px solid #767676; border-radius:3px; background:#232323; color:white; }
    .tool-row button.active { border-color:white; background:white; color:#111; }
    #annotation-tooltip { position:fixed; z-index:10004; display:none; max-width:270px; padding:7px 9px; border-radius:4px; background:#111; color:white; font:11px/1.35 monospace; pointer-events:none; }
    body.annotations-on [data-annotate] { outline:1px dashed rgba(157,40,111,.58); outline-offset:-1px; }

    @container (max-width:767px) {
      .main-row { min-height:66px; grid-template-columns:42px minmax(0,1fr) 42px; gap:8px; padding:8px 13px; }
      .utility,.actions,.guided-rail { display:none; }
      .mobile-search,.mobile-menu { display:grid; }
      .mobile-search { grid-column:1; }
      .brand-home { grid-column:2; }
      .mobile-menu { grid-column:3; }
      .brand-logo { width:min(170px,52vw); }
      .login-notice { min-height:38px; font-size:10px; }
      .document-switcher { display:grid; padding:10px 16px; }
      .document-switcher__pages { display:none; }
      .mobile-page-select { display:block; }
      .document-tools { justify-content:space-between; }
      .document-tools button { flex:1; }
      .editorial-hero,.hub-head { grid-template-columns:1fr; }
      .variant-d .hub-head--visual { grid-template-columns:1fr; }
      .variant-d .hub-visual-column { margin-top:10px; }
      .variant-d .hub-visual { min-height:210px; }
      .variant-d .hub-visual img { min-height:210px; }
      .editorial-hero__copy { padding:36px 18px; }
      .editorial-hero__mark { display:none; }
      .page-title { font-size:clamp(48px,15vw,66px); }
      .page-intro { font-size:13px; }
      .chapter-strip { top:58px; padding-inline:16px; }
      .editorial-content { padding:4px 18px 50px; }
      .editorial-section { grid-template-columns:46px minmax(0,1fr); gap:12px; padding:30px 0; }
      .editorial-section .section-body { grid-column:2; }
      .dossier-head { padding:34px 18px 28px; }
      .dossier-head__meta { align-items:flex-start; flex-direction:column; }
      .dossier-grid { grid-template-columns:1fr; }
      .dossier-nav { display:flex; gap:3px; overflow-x:auto; padding:10px 16px; border-right:0; border-bottom:1px solid var(--color-border-soft); }
      .dossier-nav strong { display:none; }
      .dossier-nav button { width:auto; min-width:max-content; border:1px solid var(--color-border-soft); background:white; }
      .dossier-article { padding:30px 18px 50px; }
      .dossier-article__chapter .section-title { font-size:32px; }
      .hub-head { padding:36px 18px 28px; }
      .hub-content { grid-template-columns:1fr; padding:24px 18px 50px; }
      .hub-aside { grid-row:1; }
      .topic summary { grid-template-columns:40px minmax(0,1fr) auto; }
      .topic summary strong { font-size:21px; }
      .topic-body { padding:0 10px 22px 58px; }
      .contact-block { grid-template-columns:1fr; }
      .update-callout { padding-inline:18px; }
    }
    @container (min-width:768px) and (max-width:1040px) {
      .main-row { padding-inline:24px; }
      .brand-logo { width:166px; }
      .actions span { display:none; }
      .analysis-entry { padding-left:24px; }
      .document-switcher { padding-inline:24px; }
      .editorial-hero__copy,.editorial-content,.dossier-head,.hub-head,.hub-content { padding-left:26px; padding-right:26px; }
      .editorial-section { grid-template-columns:65px minmax(0,.8fr) minmax(0,1.2fr); }
      .dossier-grid { grid-template-columns:230px minmax(0,1fr); }
      .dossier-nav { padding-left:26px; }
      .dossier-article { padding-inline:30px; }
      .hub-content { grid-template-columns:minmax(0,1fr) 240px; }
    }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms !important; transition-duration:.01ms !important; scroll-behavior:auto !important; } }
  </style>
</head>
<body>
  <nav class="variant-nav" aria-label="Variantes do sketch"><span class="variant-nav__label">SKETCH 004 · INSTITUCIONAL</span><button class="variant-tab active" type="button" data-variant="a">A · Editorial contínua</button><button class="variant-tab" type="button" data-variant="b">B · Dossiê navegável</button><button class="variant-tab" type="button" data-variant="c">C · Hub modular</button><button class="variant-tab" type="button" data-variant="d">D · Síntese C mais leve ★</button></nav>
  <main class="sketch-stage"><div class="viewport-shell" id="viewport-shell"><div id="sketch-viewport">
    <section class="variant active" id="variant-a" aria-label="Variante A: Editorial contínua"><div data-shell></div><div data-document-switcher></div><div class="institutional-page" data-render-a></div></section>
    <section class="variant" id="variant-b" aria-label="Variante B: Dossiê navegável"><div data-shell></div><div data-document-switcher></div><div class="institutional-page" data-render-b></div></section>
    <section class="variant" id="variant-c" aria-label="Variante C: Hub modular"><div data-shell></div><div data-document-switcher></div><div class="institutional-page" data-render-c></div></section>
    <section class="variant variant-d" id="variant-d" aria-label="Variante D: Síntese C mais leve"><div data-shell></div><div data-document-switcher></div><div class="institutional-page" data-render-d></div></section>
  </div></div></main>
  <div id="toast" role="status" aria-live="polite"></div><div id="annotation-tooltip"></div><div id="sketch-tools"><div class="tool-row"><strong>Viewport</strong><span><button type="button" data-width="375">375</button> <button type="button" data-width="768">768</button> <button class="active" type="button" data-width="1280">1280</button></span></div><div class="tool-row"><label for="theme-switcher">Tema</label><select id="theme-switcher"><option value="default">D’Accord</option></select></div><div class="tool-row"><label for="state-switcher">Estado</label><select id="state-switcher"><option value="default">Publicado</option><option value="loading">Carregando</option><option value="update">Atualização legal</option><option value="notfound">Página não encontrada</option></select></div><div class="tool-row"><span>Anotações</span><button type="button" id="annotation-toggle">Mostrar</button></div></div>

  <template id="shell-template"><header class="shell-header" data-annotate="Shell C aprovado"><div class="login-notice"><span>Novo por aqui? <strong>Entre ou crie sua conta</strong> para guardar seu progresso.</span></div><div class="main-row"><button class="mobile-search" type="button" data-mobile-toggle aria-label="Abrir busca">⌕</button><div class="utility"><button type="button" data-access-control>Acessibilidade ↓</button><button type="button" data-message="Central de ajuda será detalhada no Sketch 005.">Precisa de ajuda?</button></div><a class="brand-home" href="#" data-message="Voltar para a landing."><img class="brand-logo" src="../../../public/images/daccord-logotipo.svg" alt="D’Accord"></a><div class="actions"><button type="button" data-message="Catálogo aberto com filtros preservados.">Produtos</button><button class="outlined" type="button" data-message="Autenticação será detalhada no Sketch 007.">Entrar</button></div><button class="mobile-menu" type="button" data-mobile-toggle aria-label="Abrir menu">☰</button></div><div class="mobile-panel" data-mobile-panel><form class="search-form" data-product-search><input type="search" name="busca" placeholder="Buscar produtos" aria-label="Buscar produtos"><button type="submit" aria-label="Buscar">⌕</button></form><button type="button" data-message="Catálogo aberto com filtros persistentes.">Produtos</button><button type="button" data-analysis>Começar análise</button><button type="button" data-message="Ajuda será detalhada no Sketch 005.">Ajuda</button></div><div class="guided-rail"><div class="analysis-entry"><p><strong>Não sabe por onde começar?</strong> Responda sobre sua pele em poucos minutos.</p><button type="button" data-analysis>COMEÇAR ANÁLISE</button></div><form class="search-form" data-product-search><input type="search" name="busca" placeholder="Buscar produtos no catálogo" aria-label="Buscar produtos"><button type="submit" aria-label="Buscar">⌕</button></form></div></header></template>
  <template id="switcher-template"><div class="document-switcher"><div class="document-switcher__pages" aria-label="Páginas institucionais"><button type="button" data-page="sobre" aria-pressed="true">Sobre</button><button type="button" data-page="privacidade" aria-pressed="false">Privacidade</button><button type="button" data-page="termos" aria-pressed="false">Termos</button><button type="button" data-page="acessibilidade" aria-pressed="false">Acessibilidade</button></div><select class="mobile-page-select" data-mobile-page aria-label="Selecionar página"><option value="sobre">Sobre</option><option value="privacidade">Privacidade</option><option value="termos">Termos</option><option value="acessibilidade">Acessibilidade</option></select><div class="document-tools"><button type="button" data-reading aria-pressed="false">Modo leitura</button><button type="button" data-message="Versão para impressão preparada.">Imprimir</button><button type="button" data-message="Link desta página copiado no protótipo.">Compartilhar</button></div></div></template>

  <script>
    const PAGES={
      sobre:{label:'Sobre a D’Accord',eyebrow:'Nossa abordagem',title:'Beleza guiada pela sua pele.',intro:'Unimos cuidado, curadoria e tecnologia para transformar sinais e preferências em escolhas de skincare mais claras — sem substituir orientação médica.',updated:'31 de agosto de 2026',sections:[['Propósito','Criar uma experiência em que conhecer a própria pele ajude a escolher melhor, com explicações acessíveis e produtos criteriosamente cadastrados.','A D’Accord nasce para reduzir tentativa e erro, não para prometer uma pele ideal.'],['Como funciona','Questionário, fotografia opcional e regras de compatibilidade organizam as recomendações. Cada resultado apresenta limites, motivos e alternativas.','A análise considera somente sinais cosméticos e informações declaradas pelo usuário.'],['Limites da tecnologia','A experiência não diagnostica doenças, não prescreve tratamentos e não substitui dermatologistas. Alertas de risco interrompem a recomendação automática.','Quando o sistema não tem confiança suficiente, ele informa a incerteza e oferece um caminho seguro.'],['Compromissos','Clareza, acessibilidade, minimização de dados, curadoria responsável e possibilidade de revisar escolhas.','Produtos e regras são versionados para que toda recomendação possa ser explicada.']]},
      privacidade:{label:'Política de Privacidade',eyebrow:'Seus dados',title:'Clareza em cada escolha.',intro:'Explicamos quais dados usamos, por que usamos, por quanto tempo conservamos e como você pode exercer seus direitos.',updated:'31 de agosto de 2026',sections:[['Quem controla os dados','A D’Accord é responsável pelas decisões sobre os dados tratados na plataforma. Canais oficiais estarão disponíveis para solicitações e dúvidas.','Prestadores recebem apenas o necessário para executar serviços contratados.'],['Finalidades','Conta, análise cosmética, recomendações, segurança, pedidos, suporte e cumprimento de obrigações. Marketing depende de escolha específica.','Não usamos fotografia ou informações de pele para publicidade comportamental.'],['Dados sensíveis e fotografia','Alergias, condições declaradas e imagens exigem consentimento específico e controles reforçados. A fotografia não integra galerias administrativas.','O usuário pode continuar navegando pelo catálogo sem enviar foto.'],['Retenção e segurança','Cada categoria possui prazo e critério de eliminação. Imagens devem ser apagadas após o processamento definido no consentimento.','Criptografia, acesso mínimo, auditoria e resposta a incidentes fazem parte do desenho técnico.'],['Seus direitos','Confirmação, acesso, correção, portabilidade quando aplicável, informação, revogação e exclusão nos limites legais.','Solicitações terão acompanhamento e registro de conclusão.']]},
      termos:{label:'Termos de Uso e Compra',eyebrow:'Relação transparente',title:'Acordos claros, antes de continuar.',intro:'Estes termos organizam o uso da plataforma, as compras e os limites da orientação cosmética oferecida pela D’Accord.',updated:'31 de agosto de 2026',sections:[['Elegibilidade e conta','O usuário deve fornecer informações verdadeiras, manter suas credenciais seguras e atender aos critérios de idade definidos para o serviço.','Atividades suspeitas podem exigir nova autenticação ou bloqueio preventivo.'],['Análise e recomendação','Resultados são orientações cosméticas baseadas nas entradas disponíveis e podem variar com iluminação, qualidade da foto e mudanças na pele.','Nenhum resultado constitui diagnóstico, prescrição ou garantia de eficácia.'],['Catálogo e compra','Preço, estoque, frete e disponibilidade são confirmados antes do pagamento. Imagens e descrições devem refletir o cadastro vigente.','Direito de arrependimento, trocas e devoluções seguem a legislação aplicável e a política comercial publicada.'],['Responsabilidades','O usuário deve conferir ingredientes e rótulo físico, especialmente em caso de alergia conhecida. A D’Accord deve manter informações, trilhas de auditoria e suporte.','Uso fora das instruções do fabricante não integra a recomendação.']]},
      acessibilidade:{label:'Acessibilidade',eyebrow:'Acesso para todos',title:'Cuidado que todos podem acessar.',intro:'A experiência é construída para funcionar com teclado, leitores de tela, ampliação, contraste reforçado e redução de movimento.',updated:'31 de agosto de 2026',sections:[['Recursos disponíveis','Foco visível, hierarquia semântica, textos alternativos, labels de formulário, mensagens de erro associadas e controles com área adequada.','Preferências de texto maior e alto contraste podem ser mantidas no dispositivo.'],['Navegação por teclado','Menus, filtros, modais, formulários e carrosséis precisam funcionar sem mouse e seguir uma ordem previsível.','Nenhum componente deve criar armadilha de foco.'],['Conteúdo e linguagem','Frases diretas, instruções antes das ações, mensagens humanas e ausência de dependência exclusiva de cor ou ícone.','Explicações de IA evitam jargão e deixam limites evidentes.'],['Movimento e mídia','Animações respeitam redução de movimento. Vídeos futuros deverão oferecer legenda, controle e alternativa textual.','A funcionalidade principal permanece disponível quando transições são removidas.'],['Reportar uma barreira','Usuários podem informar dificuldades pelo canal de acessibilidade, indicando página, dispositivo e tecnologia assistiva quando desejarem.','O relato não exige conta e recebe protocolo de acompanhamento.']]}
    };
    const VISUAL_REFERENCES={
      sobre:{src:'../../../public/images/hero-skin.png',alt:'Pessoa com pele natural ao lado de um sérum em cenário rosado',caption:'Pele real como ponto de partida',position:'60% center'},
      privacidade:{src:'../../../public/images/texture.png',alt:'Texturas cosméticas e elementos de vidro em tons rosados',caption:'Cuidado também no uso dos dados',position:'center'},
      termos:{src:'../../../public/images/ritual.png',alt:'Conjunto de produtos de skincare em composição rosada',caption:'Curadoria com acordos claros',position:'center'},
      acessibilidade:{src:'../../../public/images/application.png',alt:'Pessoa aplicando sérum sobre a pele do rosto',caption:'Detalhes que precisam ser percebidos',position:'center'}
    };
    const shellTemplate=document.getElementById('shell-template'),switcherTemplate=document.getElementById('switcher-template');document.querySelectorAll('[data-shell]').forEach(t=>t.appendChild(shellTemplate.content.cloneNode(true)));document.querySelectorAll('[data-document-switcher]').forEach(t=>t.appendChild(switcherTemplate.content.cloneNode(true)));
    const viewportShell=document.getElementById('viewport-shell'),viewport=document.getElementById('sketch-viewport'),toast=document.getElementById('toast');let toastTimer,currentPage='sobre',currentState='default';
    function notify(message){clearTimeout(toastTimer);toast.textContent=message;toast.classList.add('visible');toastTimer=setTimeout(()=>toast.classList.remove('visible'),2200);}
    function activeVariant(){return document.querySelector('.variant.active');}
    function statusMarkup(page){return `<span class="document-status">Versão para wireframe · Atualizado em <strong>${page.updated}</strong></span>`;}
    function contactMarkup(pageKey){const copy=pageKey==='acessibilidade'?'Encontrou uma barreira de acesso?':'Precisa exercer um direito ou esclarecer este conteúdo?';return `<div class="contact-block"><div><strong>${copy}</strong><p>O canal correspondente será detalhado no Sketch 005.</p></div><button class="secondary" type="button" data-contact>Falar com a D’Accord</button></div>`;}
    function renderA(page,pageKey){const sections=page.sections.map((s,i)=>`<section class="editorial-section" id="a-${pageKey}-${i}" data-doc-section><span class="section-number">0${i+1}</span><h2 class="section-title">${s[0]}</h2><div class="section-body"><p>${s[1]}</p><p>${s[2]}</p></div></section>`).join('');return `<div class="editorial-hero"><div class="editorial-hero__copy"><p class="eyebrow">${page.eyebrow}</p><h1 class="page-title" data-annotate="Título institucional">${page.title}</h1><p class="page-intro">${page.intro}</p><div style="margin-top:24px">${statusMarkup(page)}</div></div><div class="editorial-hero__mark" aria-hidden="true"><span>D’</span></div></div><nav class="chapter-strip" aria-label="Capítulos">${page.sections.map((s,i)=>`<button type="button" data-scroll-section="a-${pageKey}-${i}">0${i+1} · ${s[0]}</button>`).join('')}</nav><div class="editorial-content">${sections}${contactMarkup(pageKey)}</div>`;}
    function renderB(page,pageKey){return `<header class="dossier-head"><p class="eyebrow">${page.eyebrow}</p><h1 class="page-title">${page.title}</h1><p class="page-intro">${page.intro}</p><div class="dossier-head__meta">${statusMarkup(page)}<label style="font-size:10px;font-weight:800">Buscar nesta página <input data-doc-search style="min-height:38px;margin-left:8px;padding:8px 10px;border:1px solid var(--color-border-soft)" type="search" placeholder="Digite um assunto"></label></div></header><div class="dossier-grid"><nav class="dossier-nav" aria-label="Índice do documento"><strong>Índice</strong>${page.sections.map((s,i)=>`<button type="button" data-dossier-section="${i}" aria-pressed="${i===0}"><span>0${i+1} · ${s[0]}</span><span>→</span></button>`).join('')}</nav><article class="dossier-article"><div class="dossier-article__chapter" data-dossier-content></div></article></div>`;}
    function renderC(page,pageKey){return `<header class="hub-head"><div><p class="eyebrow">${page.eyebrow}</p><h1 class="page-title">${page.title}</h1><p class="page-intro">${page.intro}</p></div><aside class="hub-meta"><strong>${page.label}</strong><p>${statusMarkup(page)}</p><p>Selecione um assunto para ler apenas o necessário.</p></aside></header><div class="hub-content"><div class="topic-list">${page.sections.map((s,i)=>`<details class="topic" ${i===0?'open':''} data-doc-section><summary><span class="section-number">0${i+1}</span><strong>${s[0]}</strong></summary><div class="topic-body"><p>${s[1]}</p><p>${s[2]}</p><button class="secondary" type="button" data-copy-section>Copiar link deste assunto</button></div></details>`).join('')}</div><aside class="hub-aside"><h2>Encontre rápido</h2><p>Busque palavras dentro desta página ou use o canal adequado.</p><form data-hub-search><input style="width:100%;min-height:42px;padding:8px 10px;border:1px solid var(--color-border-soft)" name="query" type="search" placeholder="Ex.: foto, exclusão, teclado" aria-label="Buscar nesta página"><button class="primary" type="submit">Buscar assunto</button></form><button class="secondary" type="button" data-contact>Falar com a D’Accord</button></aside></div>`;}
    function renderD(page,pageKey){const visual=VISUAL_REFERENCES[pageKey];return `<header class="hub-head hub-head--visual"><div><p class="eyebrow">${page.eyebrow}</p><h1 class="page-title">${page.title}</h1><p class="page-intro">${page.intro}</p></div><div class="hub-visual-column"><figure class="hub-visual" data-annotate="Referência visual institucional"><img src="${visual.src}" alt="${visual.alt}" style="object-position:${visual.position}"><figcaption><span>Direção visual</span><strong>${visual.caption}</strong></figcaption></figure><aside class="hub-meta"><strong>${page.label}</strong><p>${statusMarkup(page)}</p><p>Selecione um assunto para ler apenas o necessário.</p></aside></div></header><div class="hub-content"><div class="topic-list">${page.sections.map((s,i)=>`<details class="topic" ${i===0?'open':''} data-doc-section><summary><span class="section-number">0${i+1}</span><strong>${s[0]}</strong></summary><div class="topic-body"><p>${s[1]}</p><p>${s[2]}</p><button class="secondary" type="button" data-copy-section>Copiar link deste assunto</button></div></details>`).join('')}</div><aside class="hub-aside"><h2>Encontre rápido</h2><p>Busque palavras dentro desta página ou use o canal adequado.</p><form data-hub-search><input style="width:100%;min-height:42px;padding:8px 10px;border:1px solid var(--color-border-soft)" name="query" type="search" placeholder="Ex.: foto, exclusão, teclado" aria-label="Buscar nesta página"><button class="primary" type="submit">Buscar assunto</button></form><button class="secondary" type="button" data-contact>Falar com a D’Accord</button></aside></div>`;}
    function renderAll(pageKey=currentPage,state=currentState){currentPage=pageKey;currentState=state;document.querySelectorAll('.loading-cover').forEach(el=>el.remove());const page=PAGES[pageKey];const targets=[['[data-render-a]',renderA],['[data-render-b]',renderB],['[data-render-c]',renderC],['[data-render-d]',renderD]];if(state==='notfound'){targets.forEach(([selector])=>document.querySelector(selector).innerHTML=`<div class="empty-document"><div><p class="eyebrow">Erro 404</p><h1>Página não encontrada</h1><p>O conteúdo pode ter mudado. Volte ao índice institucional ou use a ajuda.</p><button class="primary" type="button" data-reset-page>Voltar para Sobre</button></div></div>`);}else{targets.forEach(([selector,renderer])=>{const target=document.querySelector(selector);target.innerHTML=`${state==='update'?'<p class="update-callout">Esta política possui uma atualização em revisão. A versão publicada continua válida até a nova data de vigência.</p>':''}${renderer(page,pageKey)}`;});bindDynamic();}if(state==='loading'){const cover=document.createElement('div');cover.className='loading-cover';cover.innerHTML='<span aria-label="Carregando"></span>';activeVariant().querySelector('.institutional-page').appendChild(cover);}document.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.page===pageKey)));document.querySelectorAll('[data-mobile-page]').forEach(s=>s.value=pageKey);document.querySelectorAll('[data-reset-page]').forEach(b=>b.addEventListener('click',()=>{currentState='default';document.getElementById('state-switcher').value='default';renderAll('sobre','default');}));}
    function fillDossier(scope,index){const page=PAGES[currentPage],section=page.sections[index];scope.querySelector('[data-dossier-content]').innerHTML=`<span class="section-number">CAPÍTULO 0${Number(index)+1}</span><h2 class="section-title">${section[0]}</h2><div class="chapter-meta"><span>${page.label}</span><span>Leitura estimada: 2 min</span></div><div class="article-copy"><p>${section[1]}</p><p>${section[2]}</p></div><div class="chapter-actions"><button class="secondary" type="button" data-message="Link deste capítulo copiado no protótipo.">Copiar link</button><button class="secondary" type="button" data-contact>Tenho uma dúvida</button></div>`;bindMessages(scope);bindContacts(scope);}
    function bindContacts(scope=document){scope.querySelectorAll('[data-contact]:not([data-contact-bound])').forEach(button=>{button.dataset.contactBound='true';button.addEventListener('click',()=>notify('Canal de contato será detalhado no Sketch 005.'));});}
    function bindDynamic(){document.querySelectorAll('[data-scroll-section]').forEach(button=>button.addEventListener('click',()=>{document.getElementById(button.dataset.scrollSection)?.scrollIntoView({behavior:'smooth',block:'start'});button.closest('.chapter-strip').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b===button));}));document.querySelectorAll('[data-render-b]').forEach(scope=>{fillDossier(scope,0);scope.querySelectorAll('[data-dossier-section]').forEach(button=>button.addEventListener('click',()=>{scope.querySelectorAll('[data-dossier-section]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));fillDossier(scope,Number(button.dataset.dossierSection));}));scope.querySelector('[data-doc-search]')?.addEventListener('input',event=>{const q=event.target.value.toLocaleLowerCase('pt-BR');scope.querySelectorAll('[data-dossier-section]').forEach(button=>button.hidden=q&&!button.textContent.toLocaleLowerCase('pt-BR').includes(q));});});document.querySelectorAll('[data-hub-search]').forEach(form=>form.addEventListener('submit',event=>{event.preventDefault();const q=new FormData(form).get('query').toLocaleLowerCase('pt-BR');let found=0;form.closest('.hub-content').querySelectorAll('.topic').forEach(topic=>{const show=!q||topic.textContent.toLocaleLowerCase('pt-BR').includes(q);topic.hidden=!show;if(show){topic.open=true;found++;}});notify(found?`${found} assunto(s) encontrado(s).`:'Nenhum assunto encontrado.');}));document.querySelectorAll('[data-copy-section]').forEach(button=>button.addEventListener('click',()=>{button.textContent='Link copiado ✓';notify('Link do assunto copiado no protótipo.');}));bindContacts(document);bindMessages(document);}
    function bindMessages(scope){scope.querySelectorAll('[data-message]:not([data-bound])').forEach(button=>{button.dataset.bound='true';button.addEventListener('click',event=>{event.preventDefault();notify(button.dataset.message);});});}
    document.querySelectorAll('[data-page]').forEach(button=>button.addEventListener('click',()=>renderAll(button.dataset.page,currentState)));document.querySelectorAll('[data-mobile-page]').forEach(select=>select.addEventListener('change',()=>renderAll(select.value,currentState)));document.querySelectorAll('[data-reading]').forEach(button=>button.addEventListener('click',()=>{viewport.classList.toggle('reading-mode');document.querySelectorAll('[data-reading]').forEach(b=>b.setAttribute('aria-pressed',String(viewport.classList.contains('reading-mode'))));notify(viewport.classList.contains('reading-mode')?'Modo leitura ativado.':'Modo leitura desativado.');}));
    document.querySelectorAll('[data-variant]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.variant').forEach(v=>v.classList.toggle('active',v.id===`variant-${button.dataset.variant}`));document.querySelectorAll('.variant-tab').forEach(b=>b.classList.toggle('active',b===button));if(currentState==='loading')renderAll(currentPage,'loading');notify(`Variante ${button.dataset.variant.toUpperCase()} aberta.`);}));document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{viewportShell.style.width=button.dataset.width==='1280'?'100%':`${button.dataset.width}px`;document.querySelectorAll('[data-width]').forEach(b=>b.classList.toggle('active',b===button));notify(`Viewport ${button.dataset.width}px.`);}));
    document.querySelectorAll('[data-mobile-toggle]').forEach(button=>button.addEventListener('click',()=>button.closest('.shell-header').querySelector('[data-mobile-panel]').classList.toggle('open')));document.querySelectorAll('[data-analysis]').forEach(button=>button.addEventListener('click',()=>notify('Análise de pele será detalhada no Sprint 3.')));document.querySelectorAll('[data-access-control]').forEach(button=>button.addEventListener('click',()=>{viewport.classList.toggle('high-contrast');notify(viewport.classList.contains('high-contrast')?'Contraste reforçado ativado.':'Contraste reforçado desativado.');}));document.querySelectorAll('[data-product-search]').forEach(form=>form.addEventListener('submit',event=>{event.preventDefault();const query=new FormData(form).get('busca');notify(query?`Busca de produto preparada: ${query}.`:'Digite um produto para buscar.');}));
    document.getElementById('state-switcher').addEventListener('change',event=>renderAll(currentPage,event.target.value));document.getElementById('theme-switcher').addEventListener('change',event=>document.getElementById('theme-link').href=`../themes/${event.target.value}.css`);
    const annotationToggle=document.getElementById('annotation-toggle'),annotationTooltip=document.getElementById('annotation-tooltip');annotationToggle.addEventListener('click',()=>{document.body.classList.toggle('annotations-on');annotationToggle.textContent=document.body.classList.contains('annotations-on')?'Ocultar':'Mostrar';annotationToggle.classList.toggle('active');});document.addEventListener('mousemove',event=>{if(!document.body.classList.contains('annotations-on'))return;const target=event.target.closest('[data-annotate]');if(!target){annotationTooltip.style.display='none';return;}const style=getComputedStyle(target);annotationTooltip.textContent=`${target.dataset.annotate} · ${style.fontSize} · ${style.color} · ${style.padding}`;annotationTooltip.style.display='block';annotationTooltip.style.left=`${Math.min(event.clientX+14,window.innerWidth-285)}px`;annotationTooltip.style.top=`${Math.min(event.clientY+14,window.innerHeight-60)}px`;});
    bindMessages(document);renderAll();
  </script>
</body>
